<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp mockup</title>
<style>
:root{--bg:#0E0B2B}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);min-height:100vh;display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start;padding:40px 16px;font-family:-apple-system,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif}

/* ===== WhatsApp chat mockup (dark mode) ===== */
.wac{width:300px;flex:none;padding:9px;border-radius:40px;background:#111;box-shadow:0 24px 50px -18px rgba(0,0,0,.7),inset 0 0 0 1.5px rgba(255,255,255,.12)}
.wac-scr{position:relative;border-radius:32px;overflow:hidden;background:#0B141A;display:flex;flex-direction:column;min-height:520px}
.wac-status{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 4px;color:#fff;font-size:12px;font-weight:600;direction:ltr}
.wac-status i{display:inline-block;width:22px;height:10px;border:1.5px solid #fff;border-radius:3px;position:relative}
.wac-status i::after{content:"";position:absolute;inset:1.5px;right:5px;background:#fff;border-radius:1px}
.wac-head{display:flex;align-items:center;gap:9px;padding:6px 12px 9px;background:#1F2C34;color:#E9EDEF}
.wac-back{font-size:22px;line-height:1;color:#E9EDEF;transform:scaleX(-1)}
.wac-av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff}
.wac-who{flex:1;min-width:0}
.wac-who b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wac-who small{display:block;font-size:11.5px;color:#8696A0}
.wac-icons{display:flex;gap:18px;direction:ltr}
.wac-icons svg{width:20px;height:20px;fill:none;stroke:#E9EDEF;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wac-body{flex:1;overflow:hidden;padding:10px 10px 6px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;
  background-color:#0B141A;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:14px 14px}
.wac-day{align-self:center;margin:6px 0 8px;background:#182229;color:#8696A0;font-size:11.5px;padding:4px 10px;border-radius:7px}
.wb{position:relative;max-width:84%;padding:6px 8px 7px 9px;border-radius:8px;font-size:14px;line-height:1.38;color:#E9EDEF;white-space:pre-line;word-wrap:break-word}
.wb.in{align-self:flex-start;background:#202C33;border-top-right-radius:0}
.wb.out{align-self:flex-end;background:#005C4B;border-top-left-radius:0}
.wb.first.in::before,.wb.first.out::before{content:"";position:absolute;top:0;width:8px;height:13px}
.wb.first.in::before{right:-7px;background:linear-gradient(225deg,transparent 50%,#202C33 50%)}
.wb.first.out::before{left:-7px;background:linear-gradient(135deg,transparent 50%,#005C4B 50%)}
.wb:not(.first).in{border-top-right-radius:8px}.wb:not(.first).out{border-top-left-radius:8px}
.wb.first{margin-top:6px}
.wb .meta{float:left;margin:7px 8px -3px 0;font-size:10.5px;color:rgba(233,237,239,.6);direction:ltr;display:inline-flex;align-items:center;gap:3px}
.wb .tick{width:16px;height:11px;fill:#53BDEB}
.wb.react{margin-bottom:14px}
.wb .rx{position:absolute;bottom:-14px;right:8px;background:#202C33;border:2px solid #0B141A;border-radius:12px;padding:0 4px;font-size:13px;line-height:20px}
.wac-input{display:flex;align-items:center;gap:8px;padding:7px 8px 12px;background:#0B141A}
.wac-field{flex:1;height:36px;border-radius:18px;background:#202C33;color:#8696A0;font-size:14px;display:flex;align-items:center;padding:0 14px}
.wac-mic{flex:none;width:36px;height:36px;border-radius:50%;background:#00A884;display:grid;place-items:center;color:#fff;font-size:15px}
</style>
</head>
<body>
<div id="chats"></div>
<script>
/* Each chat = one real testimonial. Paste the text exactly as the customer wrote it. */
const CHATS = [
  { name: 'מרדכי', avatar: '#6B7C93', status: 'מחובר/ת', day: 'יום חמישי',
    msgs: [
      { from: 'out', time: '15:08', text: 'זה פלג מהסוכני AI\nרציתי לדעת איך הולך לך בקורס אני אשמח לשמוע את דעתך' },
      { from: 'in', time: '8:09', react: '❤️', text: 'בוקר טוב אחי!\nשמע קורס מטורף, אין דברים כאלו! ממש מלא תוכן איכותי, שמלמד המון ומביא תועלת רבה לשיווק, ולימוד ויישום האוטומציות עם בינה מלאכותית של N8N חוסך המון התעסקות , תודה רבה פלג היקר, מחכה בקוצר רוח לקורס הבא שתוציא.' },
      { from: 'in', time: '8:10', text: 'אתה יכול להשתמש בזה להמלצה' },
      { from: 'out', time: '9:07', text: 'זה כיף!! עשית לי את הבוקר מרדכי' }
    ] }
];

const TICK = '<svg class="tick" viewBox="0 0 16 11" aria-hidden="true"><path d="M11.07.65 10.4 0 4.1 7.3 1.6 4.8.9 5.5l3.2 3.2zM15.07.65 14.4 0 8.1 7.3l-.7-.7-.7.7 1.4 1.4z"/></svg>';
const esc = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function renderChat(c) {
  let prev = null, body = '';
  if (c.day) body += `<span class="wac-day">${esc(c.day)}</span>`;
  c.msgs.forEach(m => {
    const first = m.from !== prev ? ' first' : ''; prev = m.from;
    body += `<p class="wb ${m.from}${first}${m.react ? ' react' : ''}">${esc(m.text)}<span class="meta">${m.time}${m.from === 'out' ? TICK : ''}</span>${m.react ? `<span class="rx">${m.react}</span>` : ''}</p>`;
  });
  return `<figure class="wac"><div class="wac-scr">
    <div class="wac-status"><span>9:41</span><i></i></div>
    <div class="wac-head"><span class="wac-back">‹</span><span class="wac-av" style="background:${c.avatar}">${esc(c.name[0])}</span><span class="wac-who"><b>${esc(c.name)}</b><small>${esc(c.status || '')}</small></span><span class="wac-icons"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="3"/><path d="m16 10 6-3v10l-6-3z"/></svg><svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg></span></div>
    <div class="wac-body">${body}</div>
    <div class="wac-input"><span class="wac-field">הודעה</span><span class="wac-mic"><svg viewBox="0 0 24 24" width="18" height="18" fill="#fff"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-2.1A7 7 0 0 0 19 12z"/></svg></span></div>
  </div></figure>`;
}
document.getElementById('chats').outerHTML = CHATS.map(renderChat).join('');
</script>
</body>
</html>
